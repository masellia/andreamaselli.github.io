- category: Projects
  date: 1 October 2027
  title: "STRONG action officially starts"
  text: "The Marie Skłodowska-Curie Staff Exchange Action STRONG, dedicated to investigating gravity in its most extreme regimes, kickoffs on October first 2026. STRONG will bring together worldwid experts working to advanc theoretical and computational tools for modelling compact objects and their gravitational-wave emission, with the aim of probing strong-field gravity, characterising astrophysical environments, and exploring possible extensions of General Relativity and of the Standard Model of particle physics and Comsology. Follows the action here!"

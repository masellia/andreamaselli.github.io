- category: Events
  date: 29 July 2026
  title: "The GSSI hosts the 2027 (first) LISA Consortium meeting"
  text: "L'Aquila and the Gran Sasso Science Institute will organize the 2027 LISA Consortium meeting, from the 5th - 8th of July 2027. As the first meeting, since the reboot of the whole Consortium, it will be a great occasion to discuss and plan the Consortium work all together. Stay tuned for further news!."

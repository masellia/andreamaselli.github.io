- title: Gravitational Waves in Astrophysical Environments
  summary: Binary black hole systems do not evolve in isolation. Rather, they can be surrounded by gas, dark matter, and fields that populate our Universe. In my current work, I investigate how astrophysical environments, such as dark matter halos around massive black holes, affect the dynamics, tidal response, and gravitational-wave emission of compact binaries, and how these environmental signatures can be distinguished from vacuum or beyond-GR effects.
  papers:
    - '2606.18341'
    - '2507.04471'
    - '2503.16649'
    - '2109.00005'
  figures:
    - src: /assets/img/research/spike.jpg
      alt: Density profiles as a function of distance from a massive black hole
      caption:
      width: 240


- title: Asymmetric Binaries and Fundamental Fields
  summary: Asymmetric binaries, such as extreme- and intermediate-mass-ratio inspirals (EMRIs and IMRIs) targeted by LISA, provide precision laboratories for testing gravity and searching for new fundamental fields in the Universe. Modelling their dynamics and gravitational-wave emission has been a major focus of my work over the past year. My work develops accurate models of the long-term evolution of EMRIs and IMRIs and assesses the relevance and detectability of deviations from General Relativity with future observations.
  papers:
    - '2607.09310'
    - '2603.10116'
    - '2106.11325'
    - '2406.07607'
  figures:
    - src: /assets/img/research/charge.jpg
      alt: Constraints on a fundamental scalar charge from asymmetric binaries
      caption:
      width: 280

- title: Black-Hole Spectroscopy and Ringdown
  summary: The ringdown of a perturbed black hole encodes its characteristic oscillation spectrum. I study how these modes are excited and how spectroscopy can test the Kerr geometry, probe surrounding matter, and reveal departures from General Relativity.
  papers:
    - '2512.07959'
    - '2412.18651'
    - '2403.09767'
    - '2311.14803'
  figures:
    - src: /assets/img/research/overtones.jpg
      alt: Excitation factors for the overtones of the fundamental mode for spinning black holes
      width: 250

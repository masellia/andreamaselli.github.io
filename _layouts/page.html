---
layout: default
---
<div class="page-header">
  <div class="page-header-line"></div>
  <div class="page-header-title">{{ page.title | upcase }}</div>
</div>

{% if page.eyebrow or page.description %}
  <div class="page-intro">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </div>
{% endif %}

<section class="content-wrap prose">
  {{ content }}
</section>
